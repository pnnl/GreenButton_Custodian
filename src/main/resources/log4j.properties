########################################
# ROOT LOGGER: still only ERROR by default
########################################
log4j.rootLogger=DEBUG, A1, file

################################
# 1) Console appender (A1) at DEBUG
################################
log4j.appender.A1=org.apache.log4j.ConsoleAppender
log4j.appender.A1.Target=System.out
log4j.appender.A1.Threshold=DEBUG
log4j.appender.A1.layout=org.apache.log4j.PatternLayout
log4j.appender.A1.layout.ConversionPattern=%d{ISO8601} [%t] %-5p %c - %m%n

################################
# 2) File appender: ERROR+ (with full stacktraces)
################################
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=datacustodian.log
log4j.appender.file.Threshold=ERROR
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.layout=org.apache.log4j.PatternLayout
# include throwable so you see the underlying exception that marked the tx rollback-only
log4j.appender.file.layout.ConversionPattern=%d{ISO8601} [%t] %-5p %c - %m%n%throwable

#####################################################
# 3) Hibernate SQL + bind‐param logging
#####################################################
log4j.logger.org.hibernate.SQL=DEBUG
log4j.logger.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#####################################################
# 4) Spring JDBC core & datasource usage
#####################################################
log4j.logger.org.springframework.jdbc.core.JdbcTemplate=DEBUG
log4j.logger.org.springframework.jdbc.datasource=DEBUG
log4j.logger.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

#####################################################
# 5) Connection‐pool (DBCP2 or HikariCP)
#####################################################
log4j.logger.org.apache.commons.dbcp2=DEBUG
log4j.logger.com.zaxxer.hikari=DEBUG

#####################################################
# 6) Spring transaction boundaries & commit internals
#####################################################
log4j.logger.org.springframework.transaction=DEBUG
log4j.logger.org.springframework.transaction.interceptor.TransactionInterceptor=TRACE
log4j.logger.org.springframework.transaction.support.AbstractPlatformTransactionManager=DEBUG

#####################################################
# 7) Your own OAuth Enhancer + TokenServices + Endpoint
#####################################################
log4j.logger.org.greenbuttonalliance.espi.datacustodian.oauth.EspiTokenEnhancer=DEBUG
log4j.logger.org.greenbuttonalliance.espi.datacustodian.oauth.AccessConfirmationController=DEBUG
log4j.logger.org.greenbuttonalliance.espi.datacustodian.oauth.EspiUserApprovalHandler=DEBUG
log4j.logger.org.greenbuttonalliance.espi.datacustodian.oauth.OauthAdminController=DEBUG
log4j.logger.org.springframework.security.oauth2.provider.token.DefaultTokenServices=TRACE
log4j.logger.org.springframework.security.oauth2.provider.endpoint.TokenEndpoint=DEBUG
log4j.logger.org.springframework.transaction=DEBUG
log4j.logger.org.springframework.transaction.interceptor=TRACE
